<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chart playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --cf-text: #1c2430;
        --cf-muted: #5c6670;
      }
      @media (prefers-color-scheme: dark) {
        :root { --cf-text: #e6ebf0; --cf-muted: #a3adb8; }
      }
      body {
        margin: 0;
        padding: 16px;
        background: #ffffff;
        color: #1c2430;
        font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f141a; color: #e6ebf0; }
      }
      h1 { font-size: 20px; margin: 0 0 12px; }
      h2 { font-size: 16px; margin: 0 0 8px; }
      .grid { display: grid; gap: 24px; grid-template-columns: 1fr; max-width: 1200px; }
      .card { min-width: 0; }
      .meta { font-size: 13px; color: var(--cf-muted); margin: 0 0 8px; }
      @media (min-width: 900px) {
        .grid { grid-template-columns: 1.5fr 1fr; align-items: start; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
